<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      connect-src must list the Supabase project's own origin (https for
      REST/Auth, wss for Realtime) — with none listed, default-src 'self'
      silently blocks every Supabase call from the renderer, including
      auth.setSession(). Update this if the project URL ever changes.
      img-src additionally allows Steam's avatar CDN, since profile
      pictures come straight from Steam's own avatarfull URLs, and Steam's
      app-header CDN, used for lobby card game banners (see
      src/renderer/src/lib/steam-images.ts).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.steamstatic.com https://avatars.akamai.steamstatic.com https://cdn.akamai.steamstatic.com; connect-src 'self' https://vqeefvrbxccfmfngwifr.supabase.co wss://vqeefvrbxccfmfngwifr.supabase.co;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gankr</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
